name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The plugin builds and tests against PUBLISHED harness packages, with no
  # monorepo checkout: this is the path a user takes with `dsh plugin add`.
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Proves the published artifact is loadable, not just compilable: pack it,
      # install it into a real profile through the CLI, and confirm the bundle
      # layer registered.
      - name: Pack and install into a profile
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          npm install -g @deepseek-ai/dsh@0.1.0-rc.6
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh plugin --profile ci add "$RUNNER_TEMP"/dsh-tool-todo-tree-*.tgz
          node -e "
            const d = require('$DSH_HOME/profiles/ci/package.json')
            if (!d.dsh.profile.bundles.includes('dsh-tool-todo-tree')) {
              throw new Error('the bundle layer was not registered')
            }
            console.log('bundle layer registered:', d.dsh.profile.bundles.join(', '))
          "

      # Reads the registered tool back off a live registry, resolving the plugin
      # from the profile and the harness packages from the healed profile mirror —
      # exactly how a profile boot resolves them.
      - name: Load the installed plugin and read its tool schema
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          cd "$DSH_HOME/profiles"
          node --input-type=module -e "
            import { createRequire } from 'node:module'
            const req = createRequire(process.env.DSH_HOME + '/profiles/ci/')
            const { Context } = await import('@deepseek-ai/cordis')
            const SystemPrompt = (await import('@deepseek-ai/dsh-system-prompt')).default
            const ToolRuntime = (await import('@deepseek-ai/dsh-tools')).default
            const plugin = await import(req.resolve('dsh-tool-todo-tree'))
            const ctx = new Context()
            await ctx.plugin(SystemPrompt, { persona: '' })
            await ctx.plugin(ToolRuntime)
            await ctx.plugin(plugin, { maxDepth: 3 })
            await ctx.fiber.await()
            const schema = ctx.get('tools').schemas().find(s => s.name === 'todo_write')
            if (!schema) throw new Error('todo_write was not registered')
            const node = schema.parameters.properties.todos.items.properties
            if (!('children' in node)) throw new Error('the nested shape is missing')
            if (!('children' in node.children.items.properties)) throw new Error('depth-2 nesting is missing')
            console.log('todo_write registered with nested children')
          "

  # The Web rendering lives in the harness client packages (TodoPanel is internal
  # to dsh-client-ui-conversation and not exported), so those edits ship as
  # patches. This job is the only place they can be verified.
  patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: dsh

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # The patches import `@deepseek-ai/dsh-tool-todo-tree/client` and add a
      # tsconfig project reference to it, so the package must be IN the tree
      # under its scoped identity before they apply. The script writes that
      # identity (workspace peers, harness tsc layout) and the two tsconfig
      # wirings; applying the patches without it leaves the tree unable to
      # typecheck.
      - name: Assemble the plugin into the harness tree
        run: node plugin/scripts/assemble-into-harness.mjs dsh

      - name: Apply the harness-side patches
        working-directory: dsh
        run: |
          for patch in ../plugin/patches/*.patch; do
            echo "applying $(basename "$patch")"
            git apply "$patch"
          done

      - name: Install dependencies
        working-directory: dsh
        run: pnpm install

      # `gen-tool-catalog` imports the plugin through the root devDependency the
      # patches add, and pnpm links that to the package's `exports` -> lib, so the
      # host libs must exist before the generators run.
      - name: Build host libs
        working-directory: dsh
        run: pnpm run build:lib:host

      # All four are artifacts of whatever is composed, and no patch carries the
      # regenerated output. `gen-persistence-catalog` is a correctness step, not a
      # docs step: without it `todo/tree` is absent from KNOWN_SESSION_EVENT_TYPES
      # and the persistence read path refuses any log carrying the event.
      - name: Regenerate the generated catalogs
        working-directory: dsh
        run: |
          pnpm run gen-persistence-catalog
          pnpm run gen-tool-catalog
          pnpm run gen-config-catalog
          pnpm run gen-doc-graphs

      - name: Typecheck
        working-directory: dsh
        run: pnpm run typecheck

      - name: Lint
        working-directory: dsh
        run: pnpm run lint

      # The flat tool carries the reciprocal guard, the two client packages carry
      # the tree rendering, and the generator spec counts both todo_write
      # registrations.
      - name: Test the patched packages
        working-directory: dsh
        run: >
          pnpm vitest run
          packages/todo
          packages/client/ui-tool
          packages/client/ui-conversation
          packages/core/tools/tests/gen-tool-catalog.spec.ts

      # Running --check after generating on the same tree proves generation is
      # deterministic.
      - name: Verify every generated catalog is fresh
        working-directory: dsh
        run: |
          pnpm run verify-tool-catalog
          pnpm run verify-config-catalog
          pnpm run verify-doc-graphs
