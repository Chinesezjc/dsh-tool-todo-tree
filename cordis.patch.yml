# dsh-tool-todo-tree bundle patch: mount the nested todo tool.
#
# It registers its own tool name (`todo_tree_write`), so it never competes with
# the flat `todo_write` the base bundle and every shipped agent preset mount.
# Both tools can be composed and the flat row is left enabled on purpose: an
# agent-scope preset row of the same name would shadow a host-scope registration,
# which is exactly the trap a shared name creates. A deployment that wants the
# nested shape INSTEAD of the flat list disables the flat row in its own overlay
# (`- id: tool-todo` with `disabled: true`).

# The row names THIS package, so Node resolution finds it through the profile's
# node_modules. It is the unscoped published name, not the `@deepseek-ai/dsh-*`
# name the same source carries inside the harness monorepo.
#
# `allowParallelInProgress` has no default: it is the same required deployment
# choice the flat tool carries. `true` matches what the harness base bundle
# configures for the flat tool. Override it here to restore the single-active
# discipline.
- insert:
    - id: tool-todo-tree
      name: dsh-tool-todo-tree
      config:
        maxDepth: 3
        allowParallelInProgress: true
